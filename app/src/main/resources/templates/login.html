<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sign Up</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/custom.css" />
    <link href='https://fonts.googleapis.com/css?family=Londrina Solid' rel='stylesheet'>
</head>
<body class="d-flex flex-column min-vh-100 no-footer-gap">
<div class="flex-grow-1">
    <div class="row h-100 no-gutters">
        <div class="col-12 col-md-4 logo-col light-column d-flex flex-column align-items-center justify-content-center">
            <img th:src="@{/images/meso_logo_2.PNG}" alt="Logo"/>
            <p>Don't have an account? <u><a class="underlined-link" th:href="@{'/signup/'}">Signup here</a></u></p>
        </div>
        <div class="col-12 col-md-8 input-col align-items-center justify-content-center">
            <h3 class="text-center mt-5">Login</h3>

            <div th:if="${successMessage}" class="alert alert-success text-center"
                 role="alert" th:text="${successMessage}"></div>

            <form th:action="@{/login}" method="post" class="pl-5 pr-5 pb-4 pt-5 mt-5">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="username"></label>
                    <input type="text" id="username" name="username" class="form-control rounded-pill" placeholder="Username" required/>
                </div>

                <div class="form-group">
                    <label for="password"></label>
                    <input type="password" id="password" name="password" class="form-control rounded-pill" placeholder="Password"  required/>

                    <label for="showPassword"></label>
                    <input type="checkbox" id="showPassword" onclick="showPassword()">Show Password
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary px-5">Login</button>
                </div>
                <div th:if="${param.error}" class="alert alert-danger" role="alert" th:text="${param.error}"></div>
            </form>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="/js/scripts.js"></script>
</body>
</html>
